name: Build LG Remote APK

on:
  push:
    paths:
      - 'tv-remote/**'
      - '.github/workflows/tv-remote.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Тот же ключ подписи, что и у Claude Bubble: новые версии ставятся поверх старых.
      - name: Use shared debug keystore
        run: cp app/debug.keystore tv-remote/app/debug.keystore

      - name: Build debug APK
        working-directory: tv-remote
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LGRemote-apk
          path: tv-remote/app/build/outputs/apk/debug/app-debug.apk
